[project]
name = "gcs-video-upload-demo"
version = "0.1.0"
description = "Large video uploads straight to Google Cloud Storage, with signed-URL playback and storage reconciliation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-auth ships without complete type hints.
module = "app.storage"
disallow_untyped_calls = false
